server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: modern-war-server
  
  datasource:
    url: jdbc:mysql://localhost:3306/war_modern?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: WarHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# 日志配置
logging:
  level:
    root: INFO
    com.war: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/modern-war.log
    max-size: 100MB
    max-history: 30

# JWT 配置
jwt:
  secret: ModernWarSecretKey2024ForJWTTokenGenerationAndValidation
  expiration: 86400000  # 24 hours in milliseconds

# 游戏配置
game:
  server-id: 1
  server-name: 绝地战争-重制版
  version: 1.0.0
